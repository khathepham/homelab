services:
    photon:
        image: rtuszik/photon-docker:latest
        env_file: .env
        volumes:
            - /omv/docker-volumes/photon-data:/photon/data
        restart: unless-stopped
        ports:
            - "2322:2322"
        healthcheck:
            test: curl -f http://localhost:2322/api?q=test || exit 1
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
