services:
    photon:
        image: rtuszik/photon-docker:2.5.0
        env_file:
          - path: ${INFISICAL_ENV_FILE:-.env}
            required: false
        volumes:
            - /omv/docker-volumes/photon-data:/photon/data
        restart: unless-stopped
        ports:
            - "2322:2322"
