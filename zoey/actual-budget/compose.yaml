services:
  actual_server:
    image: docker.io/actualbudget/actual-server:26.9.0
    ports:
      - '5006:5006'
    volumes:
      - ${DATA_DIR}/actual-budget:/data
    restart: unless-stopped

  actual-helpers:
    container_name: actual-helpers
    image: ghcr.io/psybers/actual-helpers:latest@sha256:195035417264fc2e2f42b001fd6bba0c2a1f21de5bbb0640cc8f60600abfe3c3
    env_file: .env
    volumes:
      - ${DATA_DIR}/actual-helpers/actual-cache:/usr/src/app/cache
    restart: unless-stopped

  actualtap-py:
    container_name: actualtap-py
    image: ghcr.io/bobokun/actualtap-py:v0.2.0
    ports:
      - 15482:8000
    volumes:
      - ${DATA_DIR}/actual-tap:/config
    restart: unless-stopped
     # --------------------------------------------------------------------------
  # Actual MCP Server - Production Mode
  # --------------------------------------------------------------------------
  # Production-ready configuration with secrets management

  actual-mcp-server:
    image: ghcr.io/agigante80/actual-mcp-server:0.22.1
    container_name: actual-mcp
    restart: unless-stopped
    ports:
      - "3600:3600"
    volumes:
      - ${DATA_DIR}/actual-mcp-test/mcp-data:/app/data
      - ${DATA_DIR}/actual-mcp-test/mcp-logs:/app/logs
    environment:
      # Actual connection (reuses the working public URL + creds from .env)
      - ACTUAL_SERVER_URL=${ACTUAL_SERVER_URL}
      - ACTUAL_PASSWORD=${ACTUAL_SERVER_PASSWORD}
      - ACTUAL_BUDGET_SYNC_ID=${ACTUAL_SYNC_ID}
      - BUDGET_DEFAULT_NAME=USA
      # MCP bridge
      - MCP_BRIDGE_DATA_DIR=/app/data
      - MCP_BRIDGE_PORT=3600
      - MCP_BRIDGE_BIND_HOST=0.0.0.0
      - MCP_BRIDGE_LOG_LEVEL=debug
      - MCP_BRIDGE_STORE_LOGS=true
      - MCP_BRIDGE_LOG_DIR=/app/logs
      - MAX_CONCURRENT_SESSIONS=15
      # --- OIDC auth (Auth0 test tenant) ---
      - AUTH_PROVIDER=oidc
      - OIDC_ISSUER=https://dev-tdntctz23lwiyflt.us.auth0.com/
      - OIDC_RESOURCE=https://actual-mcp.khathepham.com
      # Claude normalizes the resource to the origin (trailing slash), so Auth0
      # mints aud=https://actual-mcp.khathepham.com/ — accept that form too.
      - OIDC_ACCEPTED_AUDIENCES=https://actual-mcp.khathepham.com/
      - TZ=America/Toronto
      - NODE_ENV=production
  # --------------------------------------------------------------------------
  # Reverse Proxy - Traefik (Optional)
  # --------------------------------------------------------------------------
  # Uncomment to add HTTPS and automatic SSL with Let's Encrypt

  # traefik:
  #   image: traefik:v2.10
  #   container_name: traefik
  #   profiles:
  #     - production
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
  #     - ./traefik/acme.json:/acme.json
  #   networks:
  #     - actual-network

  # ----------------------------------------------------------------------------
  # Networks
  # ----------------------------------------------------------------------------
networks:
  actual-network:
    driver: bridge
    name: actual-network
  librechat-net:
    external: true
    name: librechat-net
  actual-net:
    external: true
    name: actual-net


# ============================================================================
# Usage Examples
# ============================================================================
#
# Prerequisites: Have an Actual Budget server running (self-hosted or cloud)
#
# 1. Development mode:
#    $ docker compose --profile dev up
#
# 2. Production deployment:
#    $ docker compose --profile production up -d
#
# 3. Build custom image:
#    $ docker compose build mcp-server-dev
#
# 4. View logs:
#    $ docker compose logs -f mcp-server-dev
#
# 5. Stop all services:
#    $ docker compose down
#
# 6. Remove all data (CAUTION: This deletes all data):
#    $ docker compose down -v
#
# ============================================================================