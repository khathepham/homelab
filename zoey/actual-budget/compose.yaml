services:
  actual_server:
    image: docker.io/actualbudget/actual-server:edge
    ports:
      - '5006:5006'
    volumes:
      - ${DATA_DIR}/actual-budget:/data
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:5006/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  actual-helpers:
    container_name: actual-helpers
    image: ghcr.io/psybers/actual-helpers:latest
    env_file: .env
    volumes:
      - ${DATA_DIR}/actual-helpers/actual-cache:/usr/src/app/cache
    restart: unless-stopped

  actualtap-py:
    container_name: actualtap-py
    build:
      context: ./actualtap
    ports:
      - 15482:8000
    volumes:
      - ${DATA_DIR}/actual-tap:/config
    restart: unless-stopped
