services:
    open-archiver:
        image: logiclabshq/open-archiver:latest
        container_name: open-archiver
        restart: unless-stopped
        ports:
            - '4000:4000'
            - '4001:3000'
        env_file:
            - .env
        volumes:
            - ${OMV_DIR}/openarchiver/archiver-data:/var/data/open-archiver
        depends_on:
            postgres:
                condition: service_healthy
            valkey:
                condition: service_healthy
            meilisearch:
                condition: service_healthy
        networks:
            - open-archiver-net
        healthcheck:
            test: curl -f http://localhost:3000/api/health || exit 1
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    postgres:
        image: postgres:17-alpine
        container_name: open-archiver-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ${DATA_DIR}/openarchiver/pgdata:/var/lib/postgresql/data
        networks:
            - open-archiver-net
        healthcheck:
            test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    valkey:
        image: valkey/valkey:8-alpine
        container_name: open-archiver-valkey
        restart: unless-stopped
        command: valkey-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - ${DATA_DIR}/openarchiver/valkeydata:/data
        networks:
            - open-archiver-net
        healthcheck:
            test: valkey-cli -a ${REDIS_PASSWORD} ping | grep -q PONG || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    meilisearch:
        image: getmeili/meilisearch:v1.15
        container_name: open-archiver-meilisearch
        restart: unless-stopped
        environment:
            MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
        volumes:
            - ${OMV_DIR}/openarchiver/meilidata:/meili_data
        networks:
            - open-archiver-net
        healthcheck:
            test: curl -f http://localhost:7700/health || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

networks:
    open-archiver-net:
        driver: bridge
