services:
  foundry:
    image: felddy/foundryvtt:release
    hostname: my_foundry_host
    volumes:
      - ${DATA_DIR}/foundryvtt/foundrydata:/data
    env_file:
      - .env
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:30000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  filebrowser:
    image: hurlenko/filebrowser
    user: "1000:1000"
    ports:
      - 8080:8080
    volumes:
      - ${DATA_DIR}/foundryvtt/foundrydata:/data
      - ${DATA_DIR}/foundryvtt/fileserver-config:/config
    environment:
      - FB_BASEURL=/filebrowser
    restart: always
    healthcheck:
      test: curl -f http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s