services:
  app:
    image: ghcr.io/hargata/lubelogger:latest
    restart: unless-stopped
    # volumes used to keep data persistent
    volumes:
      - ${DATA_DIR}/lubelogger/lubelogger_data:/App/data
      - ${DATA_DIR}/lubelogger/lubelogger_keys:/root/.aspnet/DataProtection-Keys
    # expose port and/or use serving via traefik
    ports:
      - 8158:8080
    env_file:
      - .env
    healthcheck:
      test: curl -f http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s